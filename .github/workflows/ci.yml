name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: knowledgehub
          POSTGRES_USER: knowledgehub
          POSTGRES_PASSWORD: knowledgehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U knowledgehub -d knowledgehub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://knowledgehub:knowledgehub@localhost:5432/knowledgehub
      JWT_SECRET_KEY: ci-test-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest -q